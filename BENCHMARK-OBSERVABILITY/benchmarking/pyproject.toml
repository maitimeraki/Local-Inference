[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferbench"
version = "0.1.0"
description = "vLLM benchmarking harness: workloads, metrics, experiments, cost"
requires-python = ">=3.10"
dependencies = [
    "inferobs",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "rich>=13.0",
    "prometheus-client>=0.20",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
# Linux/WSL2 only. Kept optional so the rest of the package imports and tests
# on any platform.
engine = ["vllm>=0.31,<0.32"]
tracing = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
inferbench = "inferbench.cli:main"

[tool.uv.sources]
inferobs = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inferbench"]
