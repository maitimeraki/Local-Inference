[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infergw"
version = "0.1.0"
description = "Request router, admission control and exact-match cache for vLLM backends"
requires-python = ">=3.10"
dependencies = [
    "inferobs",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.scripts]
infergw = "infergw.app:main"

[tool.uv.sources]
inferobs = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/infergw"]
