# Observability stack for the vLLM benchmarking platform.
#
# The gateway and the scheduler run natively in WSL2, NOT in containers.
# Prometheus therefore reaches them through host.docker.internal, which is
# aliased to the host gateway by the extra_hosts entry below. The engine runs
# inside the scheduler, so the engine's own metrics are scraped there too.
#
#   GATEWAY_PORT=9100 SCHEDULER_PORT=9101 ./scripts/observability.sh
#
# Then: Prometheus http://localhost:9090  Grafana http://localhost:3000
#
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # The whole directory, because the config Prometheus reads is
      # prometheus.yml and the two tiers are discovered from targets/*.json —
      # which `dev.sh` writes with the ports the grid is really on. Prometheus
      # watches those files, so the stack follows the grid instead of being
      # told about it once.
      - ./prometheus:/etc/prometheus:ro
      - ./alerts:/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  gpu-exporter:
    # 1.2.0 panics on current drivers: it registers a metric name containing
    # the unit suffix ("..._slowdown [us]"), which is not a valid name.
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1
    container_name: gpu-exporter
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  prometheus-data:
