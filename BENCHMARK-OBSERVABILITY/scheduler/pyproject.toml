[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersched"
version = "0.1.0"
description = "KV-aware scheduler tier: admission control, reservation ledger, hold queue"
requires-python = ">=3.10"
dependencies = [
    "inferobs",
    "inferbench",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.scripts]
infersched = "infersched.server:main"

[tool.uv.sources]
inferobs = { workspace = true }
inferbench = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/infersched"]
